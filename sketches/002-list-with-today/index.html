<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>时间记录 · 列表与今日</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eceaf4;color:#232033;font-family:"Segoe UI","Microsoft YaHei",sans-serif}.app{width:760px;min-height:500px;margin:0 auto;padding:30px;background:#f7f6fb}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:23px}.kicker{font:10px monospace;letter-spacing:.17em;color:#8b849e;margin-bottom:5px}h1{margin:0;font-size:25px;letter-spacing:-.06em}.sub{font-size:12px;color:#9993a7;margin-top:5px}.actions{display:flex;gap:8px}.actions button,.add button{border:1px solid #d9d5e5;border-radius:9px;background:white;color:#5a546b;padding:9px 12px;font-size:12px;cursor:pointer}.actions button:hover{border-color:#8074d9;color:#413a70}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:15px}.panel{border:1px solid #dedbe8;border-radius:15px;background:#fff;padding:16px}.panel-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:#827c92;font-size:11px}.panel-title strong{color:#363046;font-size:13px}.task{display:grid;grid-template-columns:9px 1fr auto 34px;align-items:center;gap:11px;padding:13px 10px;border-bottom:1px solid #f0eef5}.task:last-child{border-bottom:0}.task.active{margin:0 -5px;padding-left:15px;padding-right:15px;border-radius:10px;background:#f1efff}.task-dot{width:9px;height:9px;border-radius:50%;background:#bab5c7}.active .task-dot{background:#7569dd}.task-name{font-weight:700;font-size:13px}.task-meta{color:#aaa4b5;font-size:10px;margin-top:3px}.task-time{font:11px monospace;color:#777087}.task button{width:30px;height:30px;border:1px solid #d8d3e5;border-radius:8px;background:#faf9fd;color:#655d79;cursor:pointer}.active button{border:0;background:#7569dd;color:#fff}.add{display:flex;gap:7px;margin-top:12px}.add input{min-width:0;flex:1;border:1px solid #dedbe8;border-radius:9px;padding:10px;outline:0;font-size:11px}.add input:focus{border-color:#8074d9}.add button{border:0;background:#7569dd;color:#fff}.add button:hover{background:#665bc8}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}.metric{border-radius:10px;background:#f7f5ff;padding:12px}.metric small{color:#9993aa;font-size:10px}.metric strong{display:block;margin-top:5px;color:#453d6c;font:17px monospace}.axis{display:flex;justify-content:space-between;color:#b0aaba;font:9px monospace;margin-bottom:8px}.bar{position:relative;height:108px;border-radius:9px;background:repeating-linear-gradient(90deg,#f5f3fa 0,#f5f3fa calc(25% - 1px),#e5e1ef calc(25% - 1px),#e5e1ef 25%)}.block{position:absolute;top:20px;height:27px;border-radius:6px;padding:6px 8px;color:white;font-size:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.block.one{left:8%;width:25%;background:#7569dd}.block.two{left:43%;width:13%;background:#5fbd9a}.block.three{left:63%;width:22%;background:#e39a62}.idle{position:absolute;left:0;right:0;bottom:15px;text-align:center;color:#b5afc2;font-size:10px}.note{margin-top:14px;color:#9993a7;font-size:10px;line-height:1.6}@media(max-width:800px){.app{width:100%;padding:20px}.layout{grid-template-columns:1fr}.today{display:none}}
</style></head>
<body><main class="app"><header class="top"><div><div class="kicker">TIME RECORD / WEDNESDAY</div><h1>时间记录</h1><div class="sub">一键开始，暂停就是一个时间段</div></div><div class="actions"><button onclick="showToast('始终置顶：已开启')">置顶</button><button onclick="showToast('历史窗口')">历史</button></div></header>
<div class="layout"><section class="panel"><div class="panel-title"><strong>我的计时器</strong><span>只运行一个</span></div><div id="tasks"><div class="task active"><i class="task-dot"></i><div><div class="task-name">写代码</div><div class="task-meta">个人 · 开发</div></div><span class="task-time">30:42</span><button onclick="toggle(this)">Ⅱ</button></div><div class="task"><i class="task-dot"></i><div><div class="task-name">上厕所</div><div class="task-meta">生活</div></div><span class="task-time">04:18</span><button onclick="toggle(this)">▶</button></div><div class="task"><i class="task-dot"></i><div><div class="task-name">整理邮件</div><div class="task-meta">工作 · 行政</div></div><span class="task-time">10:14</span><button onclick="toggle(this)">▶</button></div></div><form class="add" onsubmit="addTask(event)"><input id="title" placeholder="输入新内容…"/><button>＋ 新增</button></form></section>
<section class="panel today"><div class="panel-title"><strong>今日概览</strong><span>09-02</span></div><div class="summary"><div class="metric"><small>已记录</small><strong>45:14</strong></div><div class="metric"><small>时间段</small><strong>6</strong></div></div><div class="axis"><span>08:00</span><span>12:00</span><span>16:00</span><span>20:00</span></div><div class="bar"><div class="block one">写代码</div><div class="block two">上厕所</div><div class="block three">整理邮件</div><div class="idle">空闲时间保持为空</div></div><p class="note">列表负责快速切换，今日概览负责确认今天做了什么。点击右上角“历史”可查看完整甘特图。</p></section></div></main><div id="toast" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:9px 13px;border-radius:8px;background:#2c264b;color:#fff;font-size:11px;opacity:0;transition:.2s"></div>
<script>function toggle(button){const current=button.closest('.task');document.querySelectorAll('.task.active').forEach(x=>{if(x!==current){x.classList.remove('active');x.querySelector('button').textContent='▶'}});const on=current.classList.toggle('active');button.textContent=on?'Ⅱ':'▶';showToast(on?'开始：'+current.querySelector('.task-name').textContent:'已暂停')}function addTask(e){e.preventDefault();const i=document.getElementById('title'),t=i.value.trim();if(!t)return;const el=document.createElement('div');el.className='task';el.innerHTML='<i class="task-dot"></i><div><div class="task-name"></div><div class="task-meta">未分类</div></div><span class="task-time">00:00</span><button onclick="toggle(this)">▶</button>';el.querySelector('.task-name').textContent=t;document.getElementById('tasks').append(el);i.value='';showToast('已新增：'+t)}function showToast(t){const x=document.getElementById('toast');x.textContent=t;x.style.opacity=1;clearTimeout(window.tt);window.tt=setTimeout(()=>x.style.opacity=0,1400)}</script></body></html>
